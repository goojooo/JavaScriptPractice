<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promises</title>
  </head>
  <body>
    <script>
        function fetchData() {
          return new Promise((resolve, reject) => {
            setTimeout(() => {
              console.log("Fetch Data");
              resolve();
            }, 1000);
          });
        }
        function processData() {
          return new Promise((resolve, reject) => {
            setTimeout(() => {
              console.log("Process Data");
              resolve();

            }, 2000);
          });
        }
        function saveData() {
          return new Promise((resolve, reject) => {
            setTimeout(() => {
              console.log("Save Data");
              resolve();

            }, 3000);
          });
        }

      //   fetchData().then(processData).then(saveData).then(() => {
      //     console.log("All task completed...");
      //   });

      async function excuteAll(){
         await fetchData();
         await processData();
         await saveData();

          console.log("All task completed...");

      }
      excuteAll();
    </script>
  </body>
</html>
