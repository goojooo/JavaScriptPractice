<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TASK 1</title>
    <style>
      p {
        font-size: 48px;
        
      }
    </style>
  </head>
  <body>
    <p id="xxx"></p>
    <script>
      // TASK

      //  1 Detect Key Press
      // Create a webpage that prints which key the user pressed inside a <p> tag.
      // Example output: "You pressed: A".
      let y = document.getElementById("xxx");
      document.addEventListener("keydown", (event) => {
        let x = event.key;
        y.textContent = `You pressed : ${x}`;
      });
 

      // 3 Convert to Uppercase on Typing
      // Whenever the user types something in the input field, automatically convert it to uppercase using keyboard events.

      // 4 Highlight Input on Enter Key
      // When the user presses Enter, change the input field’s border to green.

      // 5 Ctrl + S Shortcut
      // Block the browser’s default Ctrl + S action and display an alert:
      // "Save shortcut disabled!"

      // 6 Ctrl + A Select All Blocking
      // Prevent Ctrl + A default behavior inside a textarea and show a message:
      // "Select All disabled!"

      // 7 Show Pressed Keys Sequence
      // Whenever the user types, show the sequence of keys pressed, e.g.:
      // A → B → Backspace → C

      // 8 Only Allow Numbers
      // Create an input box where the user can only type 0–9 digits.
      // If the user types any other key, do not allow it.

      // 9 Detect CapsLock On
      // Show a warning:
      // "Warning: CapsLock is ON"
      // whenever the user types with CapsLock enabled.

      // 10 Keyboard Event Logger
      // Display logs like this when typing:
      // Keydown: a
      // Keypress: a
      // Keyup: a

      // 11 Press Space to Change Background
      // Whenever user presses the Spacebar, change the background color of the page.

      // 12 Disable Backspace Outside Input
      // When the user presses Backspace outside a text field → prevent it and show alert.

      // 13 Count Words on Typing
      // Using keyup, count words typed inside a textarea and display the total count.
    </script>
  </body>
</html>
