  <body>
    <script>
      // 5 Ctrl + S Shortcut
      // Block the browser’s default Ctrl + S action and display an alert:
      // "Save shortcut disabled!"

      document.addEventListener("keydown", (event) => {
        console.log(event.key);

            let y =document.getElementById("x").innerHTML=event.key

                y++;

        if (event.ctrlKey && (event.key == "a" || event.key == "A")) {
          alert("Select Prevented");
          event.preventDefault();
        }
      });
    </script>
  </body>
</html>
