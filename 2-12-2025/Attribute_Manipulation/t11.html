    <script>
      // Task 11: Required Fields Toggle
      // Create a form.
      // Add a button:
      // If inputs do not have required → add required
      // Else → remove required
      // Use hasAttribute, setAttribute & removeAttribute.
      let x = document.querySelector("input");

      x.hasAttribute("required");
      function removeAttr() {
        // x.classList.remove("disabled");
        // x.setAttribute("disabled", "false")

        if (x.hasAttribute("required")) {
          x.removeAttribute("required"); // enable input
        } else {
          x.setAttribute("required"); // disable input
        }
      }
    </script>
