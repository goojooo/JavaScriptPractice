      //         2. Reverse an Array Without Using reverse()
      //    Expected output: [5,4,3,2,1]

      let arr = [1, 20, 3, 55, 5];
      let start = 0;
      end = arr.length - 1;

      while (start < end) {
        let temp = arr[start];
        arr[start] = arr[end];
        arr[end] = temp;
        start++;
        end--;
      }
      console.log(arr);
