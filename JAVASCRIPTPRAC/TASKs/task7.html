<body>
    <script>
        // TASK 7: Separate Positive and Negative Numbers
        let nums = [10, -5, 20, -8, 30, -1];
        let positiveNums = [];
        let negativeNums = [];
        for (let i = 0; i < nums.length; i++) {
            if (nums[i] >= 0) {
                positiveNums.push(nums[i]);
            } else {
                negativeNums.push(nums[i]);
            }
        }
        console.log("Original Numbers: " + nums);
        console.log("Positive Numbers: " + positiveNums);
        console.log("Negative Numbers: " + negativeNums);

    </script>
</body>

</html>
