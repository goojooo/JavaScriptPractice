<body>
    <script>
        //  TASK 10: Insert Element at Specific Position
        let arr = [10, 20, 30, 40];  
        let elementToInsert = 25;
        let positionToInsert = 2; // Insert at index 2 (3rd position)
        arr.splice(positionToInsert, 0, elementToInsert); // Splice method to insert element
        console.log("Array after insertion: " + arr); 
    </script>
