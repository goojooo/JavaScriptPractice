<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TASK 8</title>
</head>

<body>
    <script>
        // TASK 8: Convert Names to Uppercase
        let names = ["sachin", "amit", "rahul"];
        let upperCaseNames = [];
        for(let i = 0; i < names.length; i++){
            upperCaseNames.push(names[i].toUpperCase());
        }
        console.log("Original Names: " + names);
        console.log("Uppercase Names: " + upperCaseNames);
    </script>
</body>

</html>
