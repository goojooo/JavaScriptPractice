<body>
    <script>
        // TASK 12: Find Common Elements Between Two Arrays using filter and includes
        let a = [1, 2, 3, 4,5];
        let b = [3, 4, 5, 6];
        let commonElements = a.filter(element => b.includes(element));
        console.log("Common Elements: " + commonElements);
    </script>
