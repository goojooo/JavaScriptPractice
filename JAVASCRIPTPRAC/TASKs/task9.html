<body>
    <script>
        // TASK 9: Sum of Odd Numbers Only
        let nums = [1, 2, 3, 4, 5, 6, 7];
        let sumOfOdds = 0;
        for (let i = 0; i < nums.length; i++) {
            if (nums[i] % 2 !== 0) {
                sumOfOdds += nums[i];
            }
        }
        console.log("Sum of Odd Numbers: " + sumOfOdds);
    </script>
</body>
