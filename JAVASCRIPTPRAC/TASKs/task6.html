<body>
    <script>
        // TASK 6: Find Missing Number
        let arr = [1, 2, 3, 5, 6];
        let n = arr.length + 1; // Total numbers should be 6 (1 to 6)
        let totalSum = (n * (n + 1)) / 2; // Sum of first n natural numbers
        let arrSum = 0;
        for (let i = 0; i < arr.length; i++) {
            arrSum += arr[i];
        }
        let missingNumber = totalSum - arrSum;
        console.log("Missing Number: " + missingNumber);
    </script>
</body>
