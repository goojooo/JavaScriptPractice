<body>
    <script>
        // TASK 2: Find Total Price of Cart
        let cart = [
            { product: "Laptop", price: 50000 },
            { product: "Mouse", price: 1000 },
            { product: "Keyboard", price: 2000 }
        ];
        let totalPricze = 0;
        for(let i = 0 ; i < cart.length; i++)
    {
        totalPricze += cart[i].price;
    }
    console.log("Total Price of cart: " + totalPricze);
    </script>
</body>
