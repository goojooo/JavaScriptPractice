<body>
    <script>
        // TASK 5: Reverse Array Without reverse()
        let arr = [10, 20, 30, 40];
        let reversedArr = [];
        for(let i = arr.length - 1; i >= 0; i--){
            reversedArr.push(arr[i]);
        }
        console.log("Original Array: " + arr);
        console.log("Reversed Array: " + reversedArr);
    </script>
</body>
