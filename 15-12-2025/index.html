<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Loop</title>
</head>
<body>
    <script>
        function A(){
            console.log("A")
        }
        function B(){
            console.log("B")
        }
        function C(){
            console.log("C")
        }
        function D(){
            console.log("AD")
        }

        A();
        setTimeout(B,2000);
        Promise.resolve().then(C);
        D();
    </script>
</body>
</html>
