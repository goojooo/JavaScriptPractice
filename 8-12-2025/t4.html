<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 4</title>
  </head>
  <body>
    <script>
      // Task 4 (Medium):
      // Create a countdown from 5 to 1, printing one number every second using repeated setTimeout.
      setTimeout(() => {
        document.writeln(5);
      }, 1000);
      setTimeout(() => {
        document.writeln(4);
      }, 2000);
      setTimeout(() => {
        document.writeln(3);
      }, 3000);
      setTimeout(() => {
        document.writeln(2);
      }, 4000);
      setTimeout(() => {
        document.writeln(1);
      }, 5000);
    </script>
  </body>
</html>
