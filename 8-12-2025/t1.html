<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 1</title>
  </head>
  <body>
    <script>
      // Task 1 (Easy):
      // Write a function greet that takes a name and a callback.
      // The callback should print "Welcome!" after printing the name.


      function greet(name, callback) {
        console.log(name);
        callback();
      }

      function askName() {
        let userName = prompt("Enter name...");
        greet(userName, function () {
          console.log("Welcome ! " );
        });
      }

      askName();
    </script>
  </body>
</html>
