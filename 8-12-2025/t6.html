<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 6</title>
    <style>
      body {
        padding: 80px;
        border: 2px dashed orangered;
      }
      div button {
        font-size: 24px;
        border: none;
        background: red;
        color: antiquewhite;
        padding: 1% 3%;
      }
    </style>
  </head>
  <body>
    <div>
      <button id="btn">Click!</button>
    </div>
    <script>
      // Task 6 (Hard – UI Based):
      // Create a button "Show Message"
      // When clicked:
      // immediately show "Please wait..."
      // after 2 seconds → show "Task Completed!"

      let btn = document.getElementById("btn");

      btn.addEventListener("click", (event) => {
        let tag = document.createElement("p");

        tag.textContent = "Please wait...";
        document.body.appendChild(tag);

        setTimeout(() => {
          tag.textContent = "Task Completed...";
        }, 3000);
      });
    </script>
  </body>
</html>
